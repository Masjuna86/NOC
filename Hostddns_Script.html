<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MikroTik OVPN & Watchdog Generator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f3f4f6;
        }
        /* Custom scrollbar for textarea */
        textarea::-webkit-scrollbar {
            width: 8px;
        }
        textarea::-webkit-scrollbar-track {
            background: #1f2937;
        }
        textarea::-webkit-scrollbar-thumb {
            background: #4b5563;
            border-radius: 4px;
        }
        textarea::-webkit-scrollbar-thumb:hover {
            background: #6b7280;
        }
    </style>
</head>
<body class="text-gray-800 antialiased min-h-screen p-4 md:p-8 flex items-center justify-center">

    <div class="max-w-6xl w-full bg-white rounded-2xl shadow-xl overflow-hidden flex flex-col md:flex-row">
        
        <!-- Left Panel: Input Form -->
        <div class="w-full md:w-5/12 bg-gray-50 p-6 md:p-8 border-r border-gray-200 overflow-y-auto max-h-screen">
            <h2 class="text-2xl font-bold text-gray-800 mb-6 flex items-center gap-2">
                <svg class="w-6 h-6 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
                Hostddns Generator
            </h2>

            <form id="configForm" class="space-y-5">
                
                <div class="space-y-3">
                    <h3 class="text-sm font-semibold text-gray-500 uppercase tracking-wider">1. Konfigurasi VPN Client</h3>
                    
                    <div class="grid grid-cols-2 gap-3">
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Jenis VPN</label>
                            <select id="vpnType" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition bg-white">
                                <option value="ovpn-client">OpenVPN (OVPN)</option>
                                <option value="l2tp-client">L2TP</option>
                                <option value="pptp-client">PPTP</option>
                                <option value="sstp-client">SSTP</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Nama Interface</label>
                            <input type="text" id="ifaceName" value="bumn@mytunnel.id" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition">
                        </div>
                    </div>
                    
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Server (Connect To)</label>
                        <input type="text" id="serverHost" placeholder="id1.mytunnel.id" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition">
                    </div>

                    <div class="grid grid-cols-2 gap-3">
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Username</label>
                            <input type="text" id="vpnUser" placeholder="user_vpn" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Password</label>
                            <input type="text" id="vpnPass" placeholder="pass_vpn" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition">
                        </div>
                    </div>
                </div>

                <hr class="border-gray-200">

                <div class="space-y-3">
                    <h3 class="text-sm font-semibold text-gray-500 uppercase tracking-wider">2. Setting Watchdog (Monitor)</h3>
                    
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Metode Monitor</label>
                        <select id="monitorMethod" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition bg-white">
                            <option value="scheduler">Scheduler (Tanpa Ping - Cek Status)</option>
                            <option value="netwatch">Netwatch (Gunakan Ping)</option>
                        </select>
                    </div>

                    <div id="targetIpContainer" class="hidden">
                        <label class="block text-sm font-medium text-gray-700 mb-1">IP Target Ping (IP Tunnel VPN)</label>
                        <input type="text" id="targetIp" value="10.8.0.1" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition">
                        <p class="text-xs text-gray-500 mt-1">Hanya diperlukan jika memilih Netwatch.</p>
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Interval Pengecekan (Detik)</label>
                        <input type="number" id="checkInterval" value="30" min="10" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition">
                    </div>
                </div>

            </form>
        </div>

        <!-- Right Panel: Script Output -->
        <div class="w-full md:w-7/12 bg-gray-900 flex flex-col relative">
            <div class="p-4 border-b border-gray-700 flex justify-between items-center bg-gray-800">
                <div class="flex items-center gap-2">
                    <!-- Mac Window Buttons (Traffic Lights) -->
                    <div class="w-3 h-3 rounded-full bg-red-500"></div>
                    <div class="w-3 h-3 rounded-full bg-yellow-500"></div>
                    <div class="w-3 h-3 rounded-full bg-green-500"></div>
                    <span class="text-gray-400 font-mono text-sm ml-3">bash - root@mikrotik:~</span>
                </div>
                <button id="copyBtn" class="bg-blue-600 hover:bg-blue-500 text-white px-4 py-1.5 rounded text-sm font-medium transition flex items-center gap-2 shadow-sm">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"></path></svg>
                    Copy Script
                </button>
            </div>
            
            <div class="flex-grow p-4 relative">
                <textarea id="scriptOutput" readonly class="w-full h-full bg-transparent text-green-400 font-mono text-sm resize-none focus:outline-none p-2" spellcheck="false"></textarea>
                
                <!-- Toast Notification Container -->
                <div id="toast" class="absolute bottom-6 left-1/2 transform -translate-x-1/2 bg-gray-800 text-white px-4 py-2 rounded-lg shadow-lg text-sm font-medium transition-opacity duration-300 opacity-0 pointer-events-none flex items-center gap-2 border border-gray-600">
                    <svg class="w-5 h-5 text-green-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>
                    Script Copied!
                </div>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            // Get DOM Elements
            const inputs = document.querySelectorAll('#configForm input, #configForm select');
            const vpnTypeEl = document.getElementById('vpnType');
            const ifaceNameEl = document.getElementById('ifaceName');
            const serverHostEl = document.getElementById('serverHost');
            const vpnUserEl = document.getElementById('vpnUser');
            const vpnPassEl = document.getElementById('vpnPass');
            const monitorMethodEl = document.getElementById('monitorMethod');
            const targetIpEl = document.getElementById('targetIp');
            const checkIntervalEl = document.getElementById('checkInterval');
            
            const targetIpContainer = document.getElementById('targetIpContainer');
            const scriptOutput = document.getElementById('scriptOutput');
            const copyBtn = document.getElementById('copyBtn');
            const toast = document.getElementById('toast');

            // Function to generate script based on inputs
            function generateScript() {
                const type = vpnTypeEl.value;
                const iface = ifaceNameEl.value || "vpn-out1";
                const host = serverHostEl.value || "SERVER_IP";
                const user = vpnUserEl.value || "USERNAME";
                const pass = vpnPassEl.value || "PASSWORD";
                const method = monitorMethodEl.value;
                const ip = targetIpEl.value || "10.8.0.1";
                const interval = checkIntervalEl.value || "30";

                const typeLabel = type.split('-')[0].toUpperCase();

                // 1. Build VPN Creation script
                let script = `/interface ${type}\n`;
                script += `add name="${iface}" connect-to="${host}" user="${user}" password="${pass}" disabled=no\n\n`;

                // 2. Build Monitor script
                if (method === "netwatch") {
                    script += `/tool netwatch\n`;
                    script += `add comment="Auto-Restart ${typeLabel} ${iface}" \\\n`;
                    script += `host=${ip} interval=${interval}s timeout=2s \\\n`;
                    script += `down-script="/interface ${type} disable [find name=\\"${iface}\\"]; \\r\\\n`;
                    script += `    \\n:delay 3s; \\r\\\n`;
                    script += `    \\n/interface ${type} enable [find name=\\"${iface}\\"]; \\r\\\n`;
                    script += `    \\n:log warning \\"${typeLabel} Terminating/RTO. Interface direstart oleh Netwatch.\\"" \\\n`;
                    script += `up-script=":log info \\"Koneksi ${typeLabel} ${iface} Kembali Normal.\\""\n`;
                } else {
                    script += `/system scheduler\n`;
                    script += `add name="Watchdog-${iface}" interval=${interval}s on-event={\n`;
                    script += `    :local iface "${iface}";\n`;
                    script += `    :local isRunning [/interface get [find name=$iface] running];\n`;
                    script += `    \n`;
                    script += `    :if ($isRunning = false) do={\n`;
                    script += `        :log warning "${typeLabel} Terminating terdeteksi pada $iface! Merestart interface...";\n`;
                    script += `        /interface ${type} disable [find name=$iface];\n`;
                    script += `        :delay 3s;\n`;
                    script += `        /interface ${type} enable [find name=$iface];\n`;
                    script += `    }\n`;
                    script += `}\n`;
                }

                scriptOutput.value = script;
            }

            // Add listeners to update script on any input change
            inputs.forEach(input => {
                input.addEventListener('input', generateScript);
                input.addEventListener('change', generateScript);
            });

            // Toggle Target IP visibility based on dropdown
            monitorMethodEl.addEventListener('change', (e) => {
                if(e.target.value === 'netwatch') {
                    targetIpContainer.classList.remove('hidden');
                } else {
                    targetIpContainer.classList.add('hidden');
                }
            });

            // Fallback copy function for iframe compatibility
            function copyToClipboard(text) {
                if (navigator.clipboard && window.isSecureContext) {
                    return navigator.clipboard.writeText(text);
                } else {
                    let textArea = document.createElement("textarea");
                    textArea.value = text;
                    textArea.style.position = "fixed";
                    textArea.style.left = "-999999px";
                    textArea.style.top = "-999999px";
                    document.body.appendChild(textArea);
                    textArea.focus();
                    textArea.select();
                    return new Promise((res, rej) => {
                        document.execCommand('copy') ? res() : rej();
                        textArea.remove();
                    });
                }
            }

            // Copy Button Click handler
            copyBtn.addEventListener('click', () => {
                const textToCopy = scriptOutput.value;
                if(!textToCopy) return;

                copyToClipboard(textToCopy)
                    .then(() => {
                        // Show toast
                        toast.classList.remove('opacity-0');
                        setTimeout(() => {
                            toast.classList.add('opacity-0');
                        }, 2000);
                    })
                    .catch(err => {
                        console.error('Failed to copy!', err);
                        // Fallback simple alert if totally fails
                        alert("Gagal copy text, silakan copy manual.");
                    });
            });

            // Generate script on initial load
            generateScript();
        });
    </script>
</body>
</html>
