    * { 
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);

    }
    
    :root {
      --bg: #f4f7f6;

      --text-dark: #0f172a;

    }

    body { 
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; 
      background: var(--bg);
      color: var(--text); 
      margin: 0; 
      padding: 0; 
      display: flex; 
      flex-direction: column; 
      min-height: 100vh;
    }

    .app-header {
      height: 64px;
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(8px);

      align-items: center;
      justify-content: space-between;
      padding: 0 24px;
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: var(--shadow-sm);
    }

    .brand-logo {
      width: 40px; height: 40px;
      background: linear-gradient(135deg, var(--accent), #ea580c);

    .brand-title p { font-size: 11px; color: var(--text-muted); font-family: 'JetBrains Mono', monospace; font-weight: 500; margin: 0;}

    .header-actions { display: flex; align-items: center; gap: 12px; }

    .btn { display: inline-flex; align-items: center; justify-content: center; gap: 7px; padding: 9px 16px; border-radius: 8px; border: none; font-family: 'Inter', sans-serif; font-size: 12px; font-weight: 600; cursor: pointer; transition: all .15s; white-space: nowrap; text-decoration: none; }

    .btn-wa:hover { background: #128C7E; transform: translateY(-1px); box-shadow: 0 4px 12px rgba(37, 211, 102, 0.3); }

    .main-container {

    /* Sidebar Kiri (Form) */

    .checkbox-item {

      align-items: flex-start;

    .checkbox-item input[type="checkbox"] {
      appearance: none;
      -webkit-appearance: none;
      width: 18px;

      border-radius: 4px;

    .checkbox-item input[type="checkbox"]:checked {

    .checkbox-item input[type="checkbox"]:checked::after {
      content: '';

      left: 5px;
      top: 2px;
      width: 4px;
      height: 8px;
      border: solid white;
      border-width: 0 2px 2px 0;
      transform: rotate(45deg);
    }

    .checkbox-label {
      font-size: 13px;
      color: var(--text);
      line-height: 1.4;
      flex: 1;
    }
    
    .checkbox-label strong {
      display: block;
      color: var(--text-dark);
      margin-bottom: 2px;
    }

    textarea.custom-input {
      width: 100%;
      min-height: 100px;
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
      color: var(--text-dark);
      resize: vertical;
      background: #f8fafc;

    textarea.custom-input:focus {
      outline: none;
      border-color: var(--accent);

    .terminal-header {

      display: flex;
      align-items: center;
      justify-content: space-between;

    .terminal-title {
      color: #94a3b8;

      font-size: 13px;
      display: flex;
      align-items: center;
      gap: 8px;

    .terminal-title::before {
      content: '';

      width: 10px;

      background: #10b981;

    .btn-copy {

      font-size: 12px;

    .btn-copy:hover { background: var(--accent-hover); }

    .terminal-body {

    .terminal-body pre {
      margin: 0;
      white-space: pre-wrap;
      word-wrap: break-word;

    .terminal-body code {

    .code-comment { color: #64748b; }

    .footer {

  <script>
    // Fungsi untuk mengubah syntax biasa menjadi colored syntax HTML
    function formatSyntax(text) {
      let lines = text.split('\n');
      let formatted = '';

      lines.forEach(line => {
        if (line.trim().startsWith('#')) {
          // Mewarnai komentar
          formatted += `<span class="code-comment">${line}</span>\n`;
        } else if (line.trim() !== '') {
          // Mewarnai command
          let parts = line.split(' ');
          let styledLine = '';
          
          parts.forEach(part => {
             if (part.startsWith('add') || part.startsWith('/ip')) {
               styledLine += `<span class="code-command">${part}</span> `;
             } else if (part.includes('=')) {
               let kv = part.split('=');
               let val = kv.slice(1).join('=');
               // Beri warna khusus pada parameter (sebelum sama dengan)
               styledLine += `<span class="code-param">${kv[0]}</span>=`;
               // Jika value pakai tanda kutip
               if (val.startsWith('"') && val.endsWith('"')) {
                 styledLine += `<span class="code-string">${val}</span> `;
               } else {
                 styledLine += `<span>${val}</span> `;
               }
             } else {
               styledLine += `<span>${part}</span> `;
             }
          });
          formatted += styledLine.trimEnd() + '\n';
        } else {
          formatted += '\n'; // Baris kosong
        }
      });
      return formatted;
    }

    // Fungsi utama generator script
    function generateScript() {
      let scriptRawText = "";

      // --------- SECTION: ADDRESS LIST ---------
      scriptRawText += "/ip firewall address-list\n";
      scriptRawText += "# Daftar DNS Terpercaya (Anycast)\n";
      
      if (document.getElementById('dnsGoogle').checked) {
        scriptRawText += 'add address=8.8.8.8 list=securedns comment="Google DNS"\n';
        scriptRawText += 'add address=8.8.4.4 list=securedns comment="Google DNS"\n';
      }
      if (document.getElementById('dnsCloudflare').checked) {
        scriptRawText += 'add address=1.1.1.1 list=securedns comment="Cloudflare"\n';
        scriptRawText += 'add address=1.0.0.1 list=securedns comment="Cloudflare"\n';
      }
      if (document.getElementById('dnsQuad9').checked) {
        scriptRawText += 'add address=9.9.9.9 list=securedns comment="Quad9 Secure"\n';
        scriptRawText += 'add address=149.112.112.112 list=securedns comment="Quad9 Secure"\n';
      }
      if (document.getElementById('dnsOpenDNS').checked) {
        scriptRawText += 'add address=208.67.222.222 list=securedns comment="OpenDNS"\n';
        scriptRawText += 'add address=208.67.220.220 list=securedns comment="OpenDNS"\n';
      }

      let customBotsRaw = document.getElementById('customBots').value;
      let botsArray = customBotsRaw.split('\n').map(ip => ip.trim()).filter(ip => ip !== '');
      
      if (botsArray.length > 0) {
        scriptRawText += "\n# Daftar IP yang sudah diidentifikasi sebagai Bot/Bahaya\n";
        botsArray.forEach(ip => {
          scriptRawText += `add address=${ip} list=IP_RustoBot\n`;
        });
      }

      // --------- SECTION: RAW FIREWALL ---------
      scriptRawText += "\n/ip firewall raw\n";
      
      if (document.getElementById('protInvalid').checked) {
        scriptRawText += "# 1. DROP Paket Tidak Valid (Menghemat CPU secara signifikan)\n";
        scriptRawText += 'add action=drop chain=prerouting connection-state=invalid comment="Drop Invalid Connections"\n\n';
      }

      if (document.getElementById('protDNS').checked) {
        scriptRawText += "# 2. Proteksi DNS (Mencegah Router jadi alat DDoS orang lain)\n";
        scriptRawText += "# Mengizinkan trafik DNS ke daftar securedns, sisanya yang dari luar akan di-drop\n";
        scriptRawText += 'add action=accept chain=prerouting dst-port=53 protocol=udp dst-address-list=securedns comment="Allow Trusted DNS"\n';
        scriptRawText += 'add action=accept chain=prerouting dst-port=53 protocol=tcp dst-address-list=securedns comment="Allow Trusted DNS"\n\n';
      }

      if (document.getElementById('protVirus').checked) {
        scriptRawText += "# 3. Blokir Port Berbahaya (Virus & Malware Port)\n";
        scriptRawText += 'add action=drop chain=prerouting dst-port=135-139 protocol=tcp comment="Drop SMB Windows (Virus)"\n';
        scriptRawText += 'add action=drop chain=prerouting dst-port=135-139 protocol=udp comment="Drop SMB Windows (Virus)"\n';
        scriptRawText += 'add action=drop chain=prerouting dst-port=445 protocol=tcp comment="Drop SMB Windows (Virus)"\n\n';
      }

      if (document.getElementById('protMemcached').checked) {
        scriptRawText += "# 4. Proteksi dari UDP Reflection Attack (Memcached & Amplification)\n";
        scriptRawText += 'add action=drop chain=prerouting protocol=udp src-port=11211 comment="Drop Memcached (DDoS)"\n';
        scriptRawText += 'add action=drop chain=prerouting dst-port=11211 protocol=udp comment="Drop Memcached (DDoS)"\n\n';
      }

      if (document.getElementById('protSMTP').checked) {
        scriptRawText += "# 5. Blokir Port SMTP (Untuk mencegah Spamming dari jaringan lokal)\n";
        scriptRawText += 'add action=drop chain=prerouting dst-port=25 protocol=tcp comment="Drop Spamming SMTP Port"\n\n';
      }

      if (document.getElementById('protBots').checked && botsArray.length > 0) {
        scriptRawText += "# 6. Blokir IP yang sudah masuk daftar Blacklist/Bot\n";
        scriptRawText += 'add action=drop chain=prerouting src-address-list=IP_RustoBot comment="Drop Known Bots"\n';
      }

      // Assign teks murni untuk dicopy dan html untuk display
      window.rawScriptText = scriptRawText;
      document.getElementById('scriptOutput').innerHTML = formatSyntax(scriptRawText);
    }

    function copyToClipboard(btnElement) {
      if (!window.rawScriptText) return;

      // Membuat elemen textarea sementara untuk proses copy
      const el = document.createElement('textarea');
      el.value = window.rawScriptText;
      document.body.appendChild(el);
      el.select();
      
      try {
        document.execCommand('copy');
        
        // Animasi tombol copy sukses
        const originalText = btnElement.innerHTML;
        btnElement.innerHTML = '<svg viewBox="0 0 24 24" width="14" height="14" stroke="currentColor" stroke-width="2" fill="none"><polyline points="20 6 9 17 4 12"></polyline></svg> Tersalin!';
        btnElement.style.background = '#10b981';
        
        setTimeout(() => {
          btnElement.innerHTML = originalText;
          btnElement.style.background = 'var(--accent)';
        }, 2000);
      } catch (err) {
        alert('Gagal menyalin text, silakan copy manual.');
      }
      
      document.body.removeChild(el);
    }

    // Eksekusi generator pertama kali ketika halaman selesai dimuat
    window.onload = function() {
      generateScript();
    }
  </script>
